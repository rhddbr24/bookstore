<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
</head>
<body>
    <th:block th:replace="common/header :: *"/>
    <div class="row justify-content-center">
        <div class="col-md-10">
            <h2 class="mb-4">마이페이지</h2>
            <div class="mb-4 d-flex gap-3">
                <a th:href="@{/users/updateemail}" class="btn btn-outline-primary btn-sm">이메일 변경</a>
                <a th:href="@{/users/updatepassword}" class="btn btn-outline-secondary btn-sm">비밀번호 변경</a>
                <a th:href="@{/orders/user}" class="btn btn-outline-success btn-sm">주문내역 전체보기</a>
            </div>
            <ul class="nav nav-tabs mb-3" id="mypageTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders" type="button" role="tab">주문내역</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="reviews-tab" data-bs-toggle="tab" data-bs-target="#reviews" type="button" role="tab">리뷰</button>
                </li>
            </ul>
            <div class="tab-content" id="mypageTabContent">
                <div class="tab-pane fade show active" id="orders" role="tabpanel">
                    <table class="table table-bordered align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>주문번호</th>
                            <th>주문일자</th>
                            <th>도서명</th>
                            <th>수량</th>
                            <th>총금액</th>
                            <th>상태</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="order : ${orders}">
                            <td th:text="${order.id}"></td>
                            <td th:text="${order.orderDate}"></td>
                            <td th:text="${order.bookName}"></td>
                            <td th:text="${order.quantity}"></td>
                            <td th:text="${order.totalPrice}"></td>
                            <td th:text="${order.status}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="6" class="text-center text-muted">주문내역이 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="tab-pane fade" id="reviews" role="tabpanel">
                    <ul class="list-group">
                        <li class="list-group-item" th:each="review : ${reviews}">
                            <div class="d-flex justify-content-between">
                                <span th:text="${review.bookName}"></span>
                                <span class="text-muted small" th:text="${review.createdAt}"></span>
                            </div>
                            <div th:text="${review.content}"></div>
                        </li>
                        <li class="list-group-item text-center text-muted" th:if="${#lists.isEmpty(reviews)}">
                            등록된 리뷰가 없습니다.
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <th:block th:replace="common/footer :: *"/>
</body>
</html>
