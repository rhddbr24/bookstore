<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이메일 변경</title>
</head>
<body>
    <th:block th:replace="common/header :: *"/>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card my-5">
                <div class="card-body text-center">
                    <h2 class="mb-4">이메일 변경 완료</h2>
                    <p class="fs-5">이메일이 성공적으로 변경되었습니다.</p>
                    <p class="mb-4">새 이메일: <strong th:text="${email}"></strong></p>
                    <div class="d-flex justify-content-center gap-3">
                        <a th:href="@{/users/mypage}" class="btn btn-primary">마이페이지</a>
                        <a th:href="@{/}" class="btn btn-outline-secondary">홈으로</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block th:replace="common/footer :: *"/>
</body>
</html>
