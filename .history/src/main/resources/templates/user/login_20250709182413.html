<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>
    <th:block th:replace="common/header :: *"/>
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="mb-4 text-center">로그인</h2>
            <form th:action="@{/users/login}" method="post">
                <div class="mb-3">
                    <input type="text" name="username" class="form-control" placeholder="아이디" required/>
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="비밀번호" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100">로그인</button>
            </form>
            <div class="d-flex justify-content-between mt-3">
                <a th:href="@{/users/register}">회원가입</a>
                <a th:href="@{/users/findusername}">아이디 찾기</a>
            </div>
        </div>
    </div>
    <th:block th:replace="common/footer :: *"/>
</body>
</html>
