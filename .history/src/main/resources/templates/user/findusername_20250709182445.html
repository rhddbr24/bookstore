<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>아이디 찾기</title>
</head>
<body>
    <th:block th:replace="common/header :: *"/>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card my-5">
                <div class="card-body text-center">
                    <h2 class="mb-4">아이디 찾기 결과</h2>
                    <div th:if="${userid != null}">
                        <p class="fs-5">회원님의 아이디는 <strong th:text="${userid}"></strong> 입니다.</p>
                    </div>
                    <div th:if="${userid == null}">
                        <p class="text-danger">일치하는 아이디가 없습니다.</p>
                    </div>
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <a th:href="@{/users/login}" class="btn btn-primary">로그인</a>
                        <a th:href="@{/users/register}" class="btn btn-outline-success">회원가입</a>
                        <a th:href="@{/}" class="btn btn-outline-secondary">홈으로</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block th:replace="common/footer :: *"/>
</body>
</html>
