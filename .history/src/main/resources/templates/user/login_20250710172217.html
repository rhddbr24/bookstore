<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body>
    <th:block th:replace="common/header :: *"/>
    <div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">
        <div style="width:320px;">
            <h2 class="mb-4 text-center">로그인</h2>
            <form th:action="@{/users/login}" method="post">
                <input type="text" name="username" class="form-control mb-2" placeholder="아이디" required/>
                <input type="password" name="password" class="form-control mb-2" placeholder="비밀번호" required/>
                <button type="submit" class="btn btn-primary w-100 mb-2">로그인</button>
            </form>
            <div class="d-flex justify-content-between">
                <a th:href="@{/register}">회원가입</a>
                <a th:href="@{/findusername}">아이디 찾기</a>
            </div>
        </div>
    </div>
    <th:block th:replace="common/footer :: *"/>
</body>
</html>
