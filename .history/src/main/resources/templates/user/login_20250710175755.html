<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <style>
      body { margin: 0; }
    </style>
</head>
<body>
    <th:block th:replace="common/header :: *"/>
    <div class="d-flex justify-content-center align-items-center" style="min-height:calc(100vh - 160px); padding-top:40px; padding-bottom:40px;">
        <div style="width:400px; background:#fff; border-radius:24px; box-shadow:0 4px 24px 0 rgba(80,80,160,0.08); padding:40px 32px;">
            <h2 class="mb-4" style="font-weight:700; color:#2d1582;">로그인</h2>
            <form th:action="@{/users/login}" method="post">
                <div class="mb-2">
                    <input type="text" name="username" class="form-control mb-2" placeholder="아이디" required/>
                    <input type="password" name="password" class="form-control" placeholder="비밀번호" required/>
                </div>
                <button type="submit" class="btn btn-primary mb-2">로그인</button>
            </form>
            <div class="d-flex justify-content-start gap-2">
                <a th:href="@{/register}">회원가입</a>
                <a th:href="@{/findusername}">아이디 찾기</a>
            </div>
        </div>
    </div>
    <th:block th:replace="common/footer :: *"/>
</body>
</html>
