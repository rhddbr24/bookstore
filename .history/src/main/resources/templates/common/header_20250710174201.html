<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>북스토어</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/header.css">
</head>
<body>
<div th:fragment="*">
  <div class="header-bar">
    <div class="header-inner">
      <a class="header-logo" th:href="@{/}">BookStore</a>
      <div class="header-actions">
        <span th:if="${session.user == null}">
          <a class="header-btn" th:href="@{/users/login}">로그인/회원가입</a>
        </span>
        <span th:if="${session.user != null}">
          <a class="header-btn" th:href="@{/users/mypage}">마이페이지</a>
          <form th:action="@{/users/logout}" method="post" style="display:inline;">
            <button type="submit" class="header-btn">로그아웃</button>
          </form>
        </span>
      </div>
    </div>
  </div>
</div>
