<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 완료</title>
</head>
<body>
    <th:block th:replace="common/header :: *"/>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="alert alert-success text-center my-5">
                <h2 class="mb-3">주문이 정상적으로 완료되었습니다!</h2>
                <p>구매해주셔서 감사합니다.<br>주문 내역은 마이페이지에서 확인하실 수 있습니다.</p>
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <a th:href="@{/users/mypage}" class="btn btn-primary">마이페이지(주문내역)</a>
                    <a th:href="@{/books/user}" class="btn btn-outline-secondary">도서목록</a>
                    <a th:href="@{/}" class="btn btn-outline-success">홈으로</a>
                </div>
            </div>
        </div>
    </div>
    <th:block th:replace="common/footer :: *"/>
</body>
</html>
