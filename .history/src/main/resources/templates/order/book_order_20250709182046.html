<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>장바구니</title>
</head>
<body>
    <th:block th:replace="common/header :: *"/>
    <div class="row justify-content-center">
        <div class="col-md-10">
            <h2 class="mb-4">장바구니</h2>
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                <tr>
                    <th>책 이름</th>
                    <th>수량</th>
                    <th>가격</th>
                    <th>삭제</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cartItems}">
                    <td th:text="${item.book.name}"></td>
                    <td th:text="${item.quantity}"></td>
                    <td th:text="${item.book.price * item.quantity}"></td>
                    <td>
                        <form th:action="@{'/carts/user/' + ${item.id}}" method="post">
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(cartItems)}">
                    <td colspan="4" class="text-center text-muted">장바구니가 비어 있습니다.</td>
                </tr>
                </tbody>
            </table>
            <div class="d-flex justify-content-end gap-2">
                <a href="/books/user" class="btn btn-outline-secondary">도서 더 담기</a>
                <a href="/orders/user" class="btn btn-primary">주문하기</a>
            </div>
        </div>
    </div>
    <th:block th:replace="common/footer :: *"/>
</body>
</html>
