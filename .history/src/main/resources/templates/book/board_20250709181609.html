<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도서 목록</title>
</head>
<body>
    <th:block th:replace="common/header :: *"/>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>도서 목록</h2>
        <form class="d-flex" th:action="@{/books/user}" method="get">
            <input class="form-control me-2" type="search" name="keyword" placeholder="도서명, 저자, 출판사 검색" aria-label="검색">
            <button class="btn btn-outline-primary" type="submit">검색</button>
        </form>
    </div>
    <div class="mb-3">
        <form class="row g-2 align-items-center" th:action="@{/books/user}" method="get">
            <div class="col-auto">
                <label for="sort" class="col-form-label">정렬:</label>
            </div>
            <div class="col-auto">
                <select class="form-select" id="sort" name="sort">
                    <option value="latest">최신순</option>
                    <option value="price_asc">가격↑</option>
                    <option value="price_desc">가격↓</option>
                    <option value="bestseller">베스트셀러</option>
                </select>
            </div>
            <div class="col-auto">
                <button class="btn btn-outline-secondary" type="submit">적용</button>
            </div>
        </form>
    </div>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="book : ${books}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${book.name}">도서명</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${book.author}">저자</h6>
                    <p class="card-text mb-1"><strong>출판사:</strong> <span th:text="${book.publisher}"></span></p>
                    <p class="card-text mb-2"><strong>가격:</strong> <span th:text="${book.price}"></span>원</p>
                    <div class="d-flex gap-2">
                        <a th:href="@{'/books/user/' + ${book.id}}" class="btn btn-sm btn-outline-primary">상세</a>
                        <form th:action="@{'/carts/user/add/' + ${book.id}}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-success">장바구니</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 페이징 예시 -->
    <nav th:if="${page != null}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{|/books/user?page=${page.number-1}|}">이전</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages-1)}" th:classappend="${page.number == i} ? 'active'">
                <a class="page-link" th:href="@{|/books/user?page=${i}|}" th:text="${i+1}"></a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{|/books/user?page=${page.number+1}|}">다음</a>
            </li>
        </ul>
    </nav>
    <th:block th:replace="common/footer :: *"/>
</body>
</html>
